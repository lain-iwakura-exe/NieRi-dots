# NieRi-dots — kitty terminal config
# Dark purple / cyberpunk (Lain-inspired) theme

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

background_opacity 0.85
dynamic_background_opacity yes

window_padding_width 10
confirm_os_window_close 0

cursor_shape beam
cursor_blink_interval 0.5

# --- Color scheme: dark purple / cyberpunk -----------------------------
foreground            #cdd6f4
background            #0a0611
selection_foreground  #0a0611
selection_background  #a277ff

cursor            #a277ff
cursor_text_color #0a0611

url_color #82aaff

# black
color0  #15121f
color8  #4b4560

# red
color1  #ff5c8a
color9  #ff88a8

# green
color2  #3ee68a
color10 #6bffb0

# yellow
color3  #ffcb6b
color11 #ffe08a

# blue
color4  #82aaff
color12 #a3c4ff

# magenta
color5  #a277ff
color13 #c4a3ff

# cyan
color6  #5ee6d9
color14 #8dfff2

# white
color7  #cdd6f4
color15 #ffffff

active_border_color   #a277ff
inactive_border_color #4b4560
tab_bar_style powerline
active_tab_background   #a277ff
active_tab_foreground   #0a0611
inactive_tab_background #15121f
inactive_tab_foreground #4b4560

shell_integration enabled

# Fish is the default login shell already; kitty just needs to launch it.
shell fish
